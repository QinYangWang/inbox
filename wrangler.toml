#:schema node_modules/wrangler/config-schema.json
# Default deployment config: outbound email via Resend.
# Inbound email always uses Cloudflare Email Routing (catch-all rule in the dashboard).
# For the Cloudflare Email Service variant, use wrangler.cloudflare.toml:
#   npm run deploy:cloudflare
name = "agentic-inbox"
compatibility_date = "2025-11-28"
main = "./workers/app.ts"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Production deploys must also define POLICY_AUD and TEAM_DOMAIN.
# TEAM_DOMAIN may be the base Access URL or the full /cdn-cgi/access/certs URL.
# The worker now fails closed outside local development if Access is not configured.
# DOMAINS (comma-separated) and EMAIL_ADDRESSES are only initial defaults —
# both can be managed at runtime from the app's Settings dialog (stored in R2).
DOMAINS = "example.com"
EMAIL_ADDRESSES = []
# Outbound email provider. This config uses Resend; set the secret with:
#   wrangler secret put RESEND_API_KEY
EMAIL_PROVIDER = "resend"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agentic-inbox"
preview_bucket_name = "agentic-inbox"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxDO"

[[durable_objects.bindings]]
name = "EMAIL_AGENT"
class_name = "EmailAgent"

[[durable_objects.bindings]]
name = "EMAIL_MCP"
class_name = "EmailMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailboxDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmailAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EmailMCP"]
