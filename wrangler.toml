#:schema node_modules/wrangler/config-schema.json
# Inbound email uses Cloudflare Email Routing. Resend is available per domain.
# To also enable Cloudflare Email Service, deploy with wrangler.cloudflare.toml.
name = "agentic-inbox"
compatibility_date = "2025-11-28"
main = "./workers/app.ts"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Production deploys must also define POLICY_AUD and TEAM_DOMAIN.
# TEAM_DOMAIN may be the base Access URL or the full /cdn-cgi/access/certs URL.
# The worker now fails closed outside local development if Access is not configured.
# Cross-account relay automation requires CLOUDFLARE_OAUTH_CLIENT_ID,
# CLOUDFLARE_OAUTH_CLIENT_SECRET, and CLOUDFLARE_OAUTH_REDIRECT_URI.

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agentic-inbox"
preview_bucket_name = "agentic-inbox"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxDO"

[[durable_objects.bindings]]
name = "EMAIL_AGENT"
class_name = "EmailAgent"

[[durable_objects.bindings]]
name = "EMAIL_MCP"
class_name = "EmailMCP"

[[durable_objects.bindings]]
name = "DOMAIN_CONFIG"
class_name = "DomainConfigDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailboxDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmailAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EmailMCP"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DomainConfigDO"]
